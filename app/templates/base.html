<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Reellog{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/validation.css') }}">
</head>
<body>
    {% block content %}{% endblock %}

    <!-- Toast notification — floating, overlays everything -->
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
            <div class="toast toast-{{ category }}" id="toast">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <script>
        // Auto-dismiss toast after 3.5s
        const toast = document.getElementById('toast');
        if (toast) {
            setTimeout(() => toast.classList.add('toast-hide'), 3500);
        }
    </script>
</body>
</html>
