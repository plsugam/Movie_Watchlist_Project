{% extends "base.html" %}
{% block title %}Add Title - Reellog{% endblock %}
{% block content %}
<div class="auth-wrapper">
    <h1>Add a Title</h1>
    <form method="POST">
        <input type="text" name="title" placeholder="Title" required>

        <select name="type" required>
            <option value="">Select Type</option>
            <option value="movie">Movie</option>
            <option value="series">Series</option>
            <option value="anime">Anime</option>
        </select>

        <select name="status">
            <option value="plan">Plan to Watch</option>
            <option value="watching">Watching</option>
            <option value="completed">Completed</option>
            <option value="dropped">Dropped</option>
        </select>

        <input type="text" name="genre" placeholder="Genre (optional)">
        <input type="number" name="year" placeholder="Year (optional)">
        <input type="number" name="rating" min="1" max="5" placeholder="Rating 1-5 (optional)">
        <textarea name="notes" placeholder="Notes (optional)"></textarea>

        <button type="submit">Add to Watchlist</button>
    </form>
    <p><a href="{{ url_for('watchlist.view_watchlist') }}">Back to watchlist</a></p>
</div>
{% endblock %}
