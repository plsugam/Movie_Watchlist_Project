{% extends "base.html" %}
{% block title %}Add Title - Reellog{% endblock %}
{% block content %}
<div class="page-wrapper">

    <nav class="topnav">
        <a href="{{ url_for('watchlist.dashboard') }}" class="logo">Reellog</a>
        <div class="nav-links">
            <a href="{{ url_for('watchlist.dashboard') }}">Dashboard</a>
            <a href="{{ url_for('watchlist.view_watchlist') }}">Watchlist</a>
            <a href="{{ url_for('watchlist.add_title') }}" class="active">+ Add</a>
            <a href="{{ url_for('auth.logout') }}">Logout</a>
        </div>
    </nav>

    <div class="page-content">
        <div class="page-header">
            <h1>Add a Title</h1>
            <a href="{{ url_for('watchlist.view_watchlist') }}" class="btn-ghost">← Back</a>
        </div>

        <div class="form-card">
            <form method="POST" class="inner-form" id="add-form" data-tmdb-key="{{ tmdb_api_key }}">
                <input type="hidden" name="csrf_token" value="{{ session['csrf_token'] }}">
                <input type="hidden" name="poster_url" id="poster_url">

                <div class="field-row">
                    <div class="field-group full" style="position:relative;">
                        <label>Title <span class="req">*</span></label>
                        <input type="text" name="title" id="title" placeholder="Search for a movie or series…" autocomplete="off">
                        <span class="error-msg" id="title-error"></span>
                        <div class="tmdb-dropdown" id="tmdb-dropdown"></div>
                    </div>
                </div>

                <div class="field-row" id="poster-row" style="display:none;">
                    <div class="field-group full">
                        <label>Poster Preview</label>
                        <img id="poster-preview" src="" alt="Poster" class="poster-preview-img" style="display:none;">
                    </div>
                </div>

                <div class="field-row">
                    <div class="field-group">
                        <label>Type <span class="req">*</span></label>
                        <select name="type" id="type">
                            <option value="">Select type</option>
                            <option value="movie">Movie</option>
                            <option value="series">Series</option>
                            <option value="anime">Anime</option>
                        </select>
                        <span class="error-msg" id="type-error"></span>
                    </div>
                    <div class="field-group">
                        <label>Status</label>
                        <select name="status" id="status">
                            <option value="plan">Plan to Watch</option>
                            <option value="watching">Watching</option>
                            <option value="completed">Completed</option>
                            <option value="dropped">Dropped</option>
                        </select>
                    </div>
                </div>

                <div class="field-row">
                    <div class="field-group">
                        <label>Genre</label>
                        <input type="text" name="genre" id="genre" placeholder="e.g. Sci-Fi">
                    </div>
                    <div class="field-group">
                        <label>Year</label>
                        <div class="number-input-wrap">
                            <input type="number" name="year" id="year" placeholder="e.g. 2023" min="1900" max="2030">
                            <div class="spin-btns">
                                <button type="button" onclick="spinUp('year', 2030)">▲</button>
                                <button type="button" onclick="spinDown('year', 1900)">▼</button>
                            </div>
                        </div>
                        <span class="error-msg" id="year-error"></span>
                    </div>
                </div>

                <div class="field-row">
                    <div class="field-group">
                        <label>Rating <span class="muted">(1–5)</span></label>
                        <div class="number-input-wrap">
                            <input type="number" name="rating" id="rating" placeholder="e.g. 4" min="1" max="5">
                            <div class="spin-btns">
                                <button type="button" onclick="spinUp('rating', 5)">▲</button>
                                <button type="button" onclick="spinDown('rating', 1)">▼</button>
                            </div>
                        </div>
                        <span class="error-msg" id="rating-error"></span>
                    </div>
                </div>

                <div class="field-row">
                    <div class="field-group full">
                        <label>Notes</label>
                        <textarea name="notes" id="notes" placeholder="Your thoughts, quotes, recommendations…"></textarea>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-primary">Add to Watchlist</button>
                    <a href="{{ url_for('watchlist.view_watchlist') }}" class="btn-ghost">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    const posterPreview = document.getElementById('poster-preview');
    const posterRow = document.getElementById('poster-row');
    const observer = new MutationObserver(() => {
        if (posterPreview.style.display !== 'none') {
            posterRow.style.display = 'grid';
        }
    });
    observer.observe(posterPreview, { attributes: true, attributeFilter: ['style'] });
</script>

<script src="{{ url_for('static', filename='js/spinners.js') }}"></script>
<script src="{{ url_for('static', filename='js/validation.js') }}"></script>
<script src="{{ url_for('static', filename='js/tmdb_search.js') }}"></script>
{% endblock %}
