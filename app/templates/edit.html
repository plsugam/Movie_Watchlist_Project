{% extends "base.html" %}
{% block title %}Edit Title - Reellog{% endblock %}
{% block content %}
<div class="page-wrapper">

    <nav class="topnav">
        <a href="{{ url_for('watchlist.dashboard') }}" class="logo">Reellog</a>
        <div class="nav-links">
            <a href="{{ url_for('watchlist.dashboard') }}">Dashboard</a>
            <a href="{{ url_for('watchlist.view_watchlist') }}" class="active">Watchlist</a>
            <a href="{{ url_for('watchlist.add_title') }}">+ Add</a>
            <a href="{{ url_for('auth.logout') }}">Logout</a>
        </div>
    </nav>

    <div class="page-content">
        <div class="page-header">
            <h1>Edit Title</h1>
            <a href="{{ url_for('watchlist.view_watchlist') }}" class="btn-ghost">← Back</a>
        </div>

        <div class="form-card">
            <form method="POST" class="inner-form">
                <input type="hidden" name="csrf_token" value="{{ session['csrf_token'] }}">

                <div class="field-row">
                    <div class="field-group full">
                        <label>Title <span class="req">*</span></label>
                        <input type="text" name="title" value="{{ entry.title }}" required>
                    </div>
                </div>

                <div class="field-row">
                    <div class="field-group">
                        <label>Type <span class="req">*</span></label>
                        <select name="type" required>
                            <option value="movie" {% if entry.type == 'movie' %}selected{% endif %}>Movie</option>
                            <option value="series" {% if entry.type == 'series' %}selected{% endif %}>Series</option>
                            <option value="anime" {% if entry.type == 'anime' %}selected{% endif %}>Anime</option>
                        </select>
                    </div>
                    <div class="field-group">
                        <label>Status</label>
                        <select name="status">
                            <option value="plan" {% if entry.status == 'plan' %}selected{% endif %}>Plan to Watch</option>
                            <option value="watching" {% if entry.status == 'watching' %}selected{% endif %}>Watching</option>
                            <option value="completed" {% if entry.status == 'completed' %}selected{% endif %}>Completed</option>
                            <option value="dropped" {% if entry.status == 'dropped' %}selected{% endif %}>Dropped</option>
                        </select>
                    </div>
                </div>

                <div class="field-row">
                    <div class="field-group">
                        <label>Genre</label>
                        <input type="text" name="genre" value="{{ entry.genre or '' }}" placeholder="e.g. Sci-Fi">
                    </div>
                    <div class="field-group">
                        <label>Year</label>
                        <div class="number-input-wrap">
                            <input type="number" name="year" id="year" value="{{ entry.year or '' }}" placeholder="e.g. 2023" min="1900" max="2030">
                            <div class="spin-btns">
                                <button type="button" onclick="spinUp('year', 2030)">▲</button>
                                <button type="button" onclick="spinDown('year', 1900)">▼</button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="field-row">
                    <div class="field-group">
                        <label>Rating <span class="muted">(1–5)</span></label>
                        <div class="number-input-wrap">
                            <input type="number" name="rating" id="rating" value="{{ entry.rating or '' }}" placeholder="e.g. 4" min="1" max="5">
                            <div class="spin-btns">
                                <button type="button" onclick="spinUp('rating', 5)">▲</button>
                                <button type="button" onclick="spinDown('rating', 1)">▼</button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="field-row">
                    <div class="field-group full">
                        <label>Notes</label>
                        <textarea name="notes" placeholder="Your thoughts…">{{ entry.notes or '' }}</textarea>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-primary">Save Changes</button>
                    <a href="{{ url_for('watchlist.view_watchlist') }}" class="btn-ghost">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
<script src="{{ url_for('static', filename='js/spinners.js') }}"></script>
{% endblock %}
