{% extends "base.html" %}
{% block title %}Edit Title - Reellog{% endblock %}
{% block content %}
<div class="auth-wrapper">
    <h1>Edit Title</h1>
    <form method="POST">
        <input type="text" name="title" placeholder="Title" value="{{ entry.title }}" required>

        <select name="type" required>
            <option value="movie" {% if entry.type == 'movie' %}selected{% endif %}>Movie</option>
            <option value="series" {% if entry.type == 'series' %}selected{% endif %}>Series</option>
            <option value="anime" {% if entry.type == 'anime' %}selected{% endif %}>Anime</option>
        </select>

        <select name="status">
            <option value="plan" {% if entry.status == 'plan' %}selected{% endif %}>Plan to Watch</option>
            <option value="watching" {% if entry.status == 'watching' %}selected{% endif %}>Watching</option>
            <option value="completed" {% if entry.status == 'completed' %}selected{% endif %}>Completed</option>
            <option value="dropped" {% if entry.status == 'dropped' %}selected{% endif %}>Dropped</option>
        </select>

        <input type="text" name="genre" placeholder="Genre (optional)" value="{{ entry.genre or '' }}">
        <input type="number" name="year" placeholder="Year (optional)" value="{{ entry.year or '' }}">
        <input type="number" name="rating" min="1" max="5" placeholder="Rating 1-5 (optional)" value="{{ entry.rating or '' }}">
        <textarea name="notes" placeholder="Notes (optional)">{{ entry.notes or '' }}</textarea>

        <button type="submit">Save Changes</button>
    </form>
    <p><a href="{{ url_for('watchlist.view_watchlist') }}">Back to watchlist</a></p>
</div>
{% endblock %}
